shell: zsh
flavor: android
region: oregon

packages:
  - fd-find
  - git
  - zsh
  - fonts-powerline
  
repositories:
  - dest: /tmp/powerlevel10k
    repo: https://github.com/romkatv/powerlevel10k.git
  - dest: /tmp/dotfiles
    repo: https://github.com/yhartanto/dotfiles.git
    update: true

tasks:
  - name: Install Powerlevel10k
    command: |
      if [ -r /home/user/.powerlevel10k/powerlevel10k.zsh-theme ]; then
        exit 0
      elif [ -r /tmp/powerlevel10k/powerlevel10k.zsh-theme ]; then
        mv /tmp/powerlevel10k /home/user/.powerlevel10k
      else
        git clone --depth=1 https://github.com/romkatv/powerlevel10k.git /home/user/.powerlevel10k
      fi
    when: on-create,on-restart
  - name: Copy latest zsh dotfiles into home
    command: cp -abf /tmp/dotfiles/zsh/. /home/user
    when: on-create,on-restart
